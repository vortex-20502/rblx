<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIN WINNERS 2005</title>

<audio id="winnersMusic" autoplay loop>
  <source src="po.mp3" type="audio/mpeg">
</audio>

<script>
const music = document.getElementById("winnersMusic");
music.volume = 0.4;

window.addEventListener("load", () => {
  music.play().catch(() => {
    document.addEventListener("click", function startMusic() {
      music.play();
    }, { once: true });
  });
});
</script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f5f5f5;
    color: #222;
    font-family: Arial, sans-serif;
}

header {
    background: white;
    padding: 22px 12px;
    text-align: center;
    border-bottom: 3px solid #c90020;
    position: sticky;
    top: 0;
    z-index: 10;
}

.logo {
    color: #d00020;
    font-size: clamp(25px, 6vw, 42px);
    font-weight: 1000;
    letter-spacing: 1px;
    margin: 0;
}

.subtitle {
    margin: 8px 0 0;
    color: #555;
    font-size: 13px;
    font-weight: bold;
}

.toolbar {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    padding: 16px 12px;
}

input, button {
    font-size: 15px;
    border-radius: 12px;
    padding: 12px;
}

input[type="text"] {
    border: 1px solid #ddd;
    background: white;
    min-width: 0;
    width: 100%;
}

.search {
    max-width: 450px;
    width: 100%;
}

button, .upload-label {
    border: none;
    background: #d00020;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.upload-label {
    padding: 13px 18px;
    border-radius: 12px;
    display: inline-block;
}

.upload-label:hover, button:hover {
    background: #a90019;
}

#upload {
    display: none;
}

#message {
    text-align: center;
    color: #b0001b;
    font-size: 14px;
    padding: 0 15px;
}

.section-title {
    padding: 0 16px;
    font-size: 20px;
    font-weight: 900;
}

.gallery {
    columns: 2;
    column-gap: 12px;
    padding: 12px;
}

.pin {
    display: inline-block;
    width: 100%;
    background: white;
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 12px;
    break-inside: avoid;
    box-shadow: 0 2px 8px #00000012;
}

.pin img {
    width: 100%;
    height: auto;
    display: block;
    cursor: pointer;
}

.pin-info {
    padding: 11px;
}

.pin-title {
    font-weight: bold;
    overflow-wrap: anywhere;
    margin-bottom: 10px;
}

.pin-actions {
    display: flex;
    gap: 7px;
}

.pin-actions button {
    font-size: 12px;
    padding: 9px;
    flex: 1;
}

.delete {
    background: #333;
}

.empty {
    text-align: center;
    padding: 35px 20px;
    color: #777;
    line-height: 1.8;
}

footer {
    background: #191919;
    color: white;
    padding: 25px 10px;
    text-align: center;
    margin-top: 20px;
    font-weight: bold;
}

@media (min-width: 600px) {
    .gallery { columns: 3; }
}

@media (min-width: 950px) {
    .gallery { columns: 4; }
}

@media (min-width: 1250px) {
    .gallery { columns: 5; }
}
</style>
</head>

<body>

<header>
    <h1 class="logo">PIN WINNERS 2005</h1>
    <p class="subtitle">ULTRAS WINNERS ROBLOX • PHOTO COMMUNITY</p>
</header>

<div class="toolbar">
    <input
        class="search"
        type="text"
        id="search"
        placeholder="🔍 Rechercher une photo..."
    >

    <input
        type="text"
        id="photoTitle"
        placeholder="Titre de la photo..."
        style="max-width:280px;"
    >

    <label for="upload" class="upload-label">
        + Ajouter des photos
    </label>

    <input
        type="file"
        id="upload"
        accept="image/*"
        multiple
    >
</div>

<p id="message">
    شارك تصاور التيفوهات، الباشات وأجواء Ultras Winners ❤️
</p>

<h2 class="section-title">📸 Galerie Winners</h2>

<div id="gallery" class="gallery"></div>

<footer>
    PIN WINNERS 2005<br>
    <span style="color:#ff304b;font-size:12px;">
        ULTRAS WINNERS • 2005
    </span>
</footer>

<script>
const gallery = document.getElementById("gallery");
const upload = document.getElementById("upload");
const search = document.getElementById("search");
const photoTitle = document.getElementById("photoTitle");
const message = document.getElementById("message");

let photos = [];

try {
    photos = JSON.parse(
        localStorage.getItem("pinWinnersPhotos") || "[]"
    );
} catch (e) {
    photos = [];
}

function savePhotos() {
    try {
        localStorage.setItem(
            "pinWinnersPhotos",
            JSON.stringify(photos)
        );
        message.textContent = "تم حفظ التغييرات على هاد الجهاز ❤️";
    } catch (e) {
        message.textContent =
            "المساحة عامرة. حذف شي صور وجرب من جديد.";
    }
}

function renderPhotos() {
    gallery.innerHTML = "";

    const term = search.value.toLowerCase().trim();

    const filtered = photos.filter(photo =>
        photo.title.toLowerCase().includes(term)
    );

    if (filtered.length === 0) {
        gallery.innerHTML = `
            <div class="empty">
                <h3>❤️ PIN WINNERS 2005</h3>
                مازال ما كايناش تصاور هنا.<br>
                كليكي على «إضافة صور» باش تبدا تعمر المعرض.
            </div>`;
        return;
    }

    filtered.forEach(photo => {
        const card = document.createElement("article");
        card.className = "pin";

        const img = document.createElement("img");
        img.src = photo.src;
        img.alt = photo.title;
        img.loading = "lazy";

        img.addEventListener("click", () => {
            const win = window.open();
            if (win) {
                const image = win.document.createElement("img");
                image.src = photo.src;
                image.style.cssText =
                    "max-width:100%;height:auto;display:block;margin:auto";
                win.document.body.style.cssText =
                    "margin:0;background:#111;text-align:center";
                win.document.body.appendChild(image);
            }
        });

        const info = document.createElement("div");
        info.className = "pin-info";

        const title = document.createElement("div");
        title.className = "pin-title";
        title.textContent = photo.title;

        const actions = document.createElement("div");
        actions.className = "pin-actions";

        const share = document.createElement("button");
        share.textContent = "↗ مشاركة";

        share.onclick = async () => {
            try {
                const response = await fetch(photo.src);
                const blob = await response.blob();
                const file = new File(
                    [blob], "winners-photo.jpg",
                    { type: blob.type }
                );

                if (navigator.canShare &&
                    navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        title: photo.title,
                        files: [file]
                    });
                } else {
                    const link = document.createElement("a");
                    link.href = photo.src;
                    link.download = "winners-photo.jpg";
                    link.click();
                }
            } catch (e) {
                message.textContent =
                    "ما قدرناش نشاركو الصورة. جرب تحملها.";
            }
        };

        const remove = document.createElement("button");
        remove.className = "delete";
        remove.textContent = "حذف";

        remove.onclick = () => {
            if (confirm("واش بغيتي تحذف هاد الصورة؟")) {
                photos = photos.filter(p => p.id !== photo.id);
                savePhotos();
                renderPhotos();
            }
        };

        actions.append(share, remove);
        info.append(title, actions);
        card.append(img, info);
        gallery.append(card);
    });
}

upload.addEventListener("change", async () => {
    const files = Array.from(upload.files || []);
    const titleText = photoTitle.value.trim();

    for (const file of files) {
        if (!file.type.startsWith("image/")) continue;

        if (file.size > 3 * 1024 * 1024) {
            message.textContent =
                "بعض الصور كبار بزاف. استعمل صور أقل من 3MB للصورة.";
            continue;
        }

        const src = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
        }).catch(() => null);

        if (!src) continue;

        photos.unshift({
            id: Date.now().toString() + Math.random(),
            title: titleText || file.name.replace(/\.[^/.]+$/, ""),
            src
        });

        try {
            localStorage.setItem(
                "pinWinnersPhotos",
                JSON.stringify(photos)
            );
        } catch (e) {
            photos.shift();
            message.textContent =
                "المساحة ما كافياش. حذف صور قديمة أو نقص الحجم.";
            break;
        }
    }

    photoTitle.value = "";
    upload.value = "";
    renderPhotos();
});

search.addEventListener("input", renderPhotos);

renderPhotos();
</script>

</body>
</html>
